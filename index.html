<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обратный звонок — KUGOO</title>
 
  <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="modal-overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">

    <!-- Close button -->
    <button class="close-btn" onclick="closeModal()" aria-label="Закрыть">
      <i class="ti ti-x"></i>
    </button>

    <!-- Left: Form -->
    <div class="modal-left" id="form-side">
      <h2 class="modal-title">Менеджер позвонит<br>вам в течение 5 минут</h2>
      <p class="modal-sub">ответит на все вопросы и проконсультирует<br>по продуктам Kugoo</p>

      <div class="phone-input-wrap" id="input-wrap">
        <span class="phone-prefix">+7</span>
        <input
          class="phone-input"
          type="tel"
          id="phone"
          placeholder="(___) __ – __ – __"
          maxlength="16"
          autocomplete="tel"
        >
      </div>

      <button class="call-btn" onclick="handleCall()">Позвоните мне</button>

      <div class="consent">
        <i class="ti ti-check"></i>
        <span>
          Нажимая на кнопку, вы соглашаетесь на обработку персональных данных
          и <a href="#">политикой конфиденциальности</a>
        </span>
      </div>
    </div>

    <!-- Success state -->
    <div class="success-msg" id="success-msg">
      <div class="success-icon"><i class="ti ti-phone-call"></i></div>
      <p class="success-title">Заявка принята!</p>
      <p class="success-sub">Менеджер перезвонит вам<br>в течение 5 минут</p>
    </div>

    <!-- Right: Photo -->
    <div class="modal-right">
 
      
<img src="553162456fb7802bbd49b25e99d55d6915bf6bc8.png" alt="" >
   

    </div>

  </div>
</div>





</body>
</html>
